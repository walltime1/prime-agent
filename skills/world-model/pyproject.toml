# Kernel-side package for the bundled world-model skill. It uses only the
# Python standard library (sqlite3); prime-agent-runtime is always installed
# in the kernel venv before skills, so it is intentionally not declared as a
# dependency (it is not published on PyPI). There is no [project.scripts]
# entry: the skill is a multi-operation API, not a single command, so the
# Python kernel is its only interface.
[project]
name = "world-model"
version = "0.1.0"
description = "Prime Agent world-model skill: shared SQLite (WAL) store for hypotheses, evidence, claims, and tasks."
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/world_model"]
